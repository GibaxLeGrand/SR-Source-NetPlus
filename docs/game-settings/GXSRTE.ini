# Sonic Riders Tournament Edition (GXSRTE, the TE patch of the GameCube NTSC-U game): settings for SR-Source's
# StaticRecomp CPU core, as GXEE8P.ini. Copied over Sys/GameSettings/GXSRTE.ini of ModernGekko's Dolphin by
# tools/build_tools.sh --chassis (MODERNGEKKO_GAME_SETTINGS_OVERRIDE). JIT64 doesn't read them.
[Core]
StaticRecompFallbackRanges =
# The OS idle loop (lwz/cmpwi/beq on the run-queue bits, waiting for a thread to be ready; TE's code has it
# at 0x80008704, in 0x8000866C, where the US game has 0x80010574): StaticRecomp skips to the next event there,
# as JIT64's idle skipping does.
StaticRecompIdlePC = 0x80008704
